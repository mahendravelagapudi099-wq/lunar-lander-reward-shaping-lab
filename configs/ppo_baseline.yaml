# PPO baseline for LunarLander-v3.
# Hyperparameters from the RL Baselines3 Zoo tuned recipe (fetch date 2026-10-15):
#   https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml
#   LunarLander-v3:  n_envs: 16, n_timesteps: 1e6, MlpPolicy, n_steps: 1024,
#   batch_size: 64, gae_lambda: 0.98, gamma: 0.999, n_epochs: 4, ent_coef: 0.01
# (learning_rate 3e-4 and clip_range 0.2 are the SB3 defaults and are noted
# here for documentation only.)

env_id: LunarLander-v3
total_timesteps: 1000000
n_envs: 16
# SubprocVecEnv measured ~2.4x faster than DummyVecEnv on this machine
# (885.7 vs 376.6 steps/s, see results/timing/), so training uses subprocess
# workers for the environment steps.
vec_env: dummy
# Single-threaded torch: 12-thread intra-op parallelism is much slower for the
# tiny (64, 64) policy (see results/timing and progress.md).
torch_threads: 1
seed: 0

hyperparameters:
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 64
  gae_lambda: 0.98
  gamma: 0.999
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2

# Periodic evaluation on the original reward, no rendering.
eval:
  freq_timesteps: 50000
  episodes: 10

# Rolling checkpoints (for resumability).
checkpoint:
  freq_timesteps: 50000
