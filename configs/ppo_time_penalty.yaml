# PPO + time-penalty shaping (Phase 2, mode = time_penalty).
# Identical to configs/ppo_baseline.yaml EXCEPT the reward block: the agent
# sees the built-in reward minus 0.05 per frame. Hyperparameters from the RL
# Baselines3 Zoo tuned recipe (fetch date 2026-10-15):
#   https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml
#   LunarLander-v3:  n_envs: 16, n_timesteps: 1e6, MlpPolicy, n_steps: 1024,
#   batch_size: 64, gae_lambda: 0.98, gamma: 0.999, n_epochs: 4, ent_coef: 0.01

env_id: LunarLander-v3
total_timesteps: 1000000
n_envs: 16
vec_env: dummy
torch_threads: 1
seed: 0
# Measured on this machine at n_envs=16 (Phase 1: 693-733 steps/s); used only
# to print an estimated wall time before training.
est_steps_per_sec: 700

reward:
  mode: time_penalty
  params:
    time_penalty: 0.05  # per-frame cost; -50 over a 1000-step episode

hyperparameters:
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 64
  gae_lambda: 0.98
  gamma: 0.999
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2

eval:
  freq_timesteps: 50000
  episodes: 10

checkpoint:
  freq_timesteps: 50000
